<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — Eshak pay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/img/eshak-logo.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div id="app">

        <header class="header">
            <a class="logo" href="/">
                <img src="/static/img/eshak-logo.png" alt="Eshak Pay">
                <span>eshak pay</span>
            </a>

            <button
                class="theme-toggle"
                id="theme-toggle"
                aria-label="Переключить тему"
            >
                ◐
            </button>
        </header>

        <main class="auth">
            <div class="auth-content">

                <span class="eyebrow">WELCOME BACK</span>

                <h1>
                    С возвращением.
                    <span>Войти.</span>
                </h1>

                <p>
                    Войди в свой аккаунт Eshak pay.
                </p>

                <form id="login-form" novalidate>

                    <div class="form-group">
                        <label for="email">Электронная почта</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@mail.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Введите пароль"
                            required
                        >
                    </div>

                    <button type="submit" class="button button-primary">
                        Войти
                    </button>

                </form>

                <p id="form-message" class="form-message"></p>

                <div class="auth-footer">
                    Нет аккаунта?
                    <a href="/register">Создать</a>
                </div>

            </div>
        </main>

        <footer class="footer">
            <span>ESHAK PAY © 2026</span>
            <span>BUILT FOR SIMPLICITY</span>
        </footer>

    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/login.js"></script>

</body>
</html>
