<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>История — Eshak pay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="/static/img/eshak-logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div id="app">

    <header class="header">
        <a class="logo" href="/">
            <img src="/static/img/eshak-logo.png" alt="Eshak Pay">
            <span>eshak pay</span>
        </a>

        <div class="header-actions">
            <button
                class="theme-toggle"
                id="theme-toggle"
                aria-label="Переключить тему"
            >
                ◐
            </button>
        </div>
    </header>

    <main class="dashboard">

        <a href="/dashboard" class="back-link">
            ← Личный кабинет
        </a>

        <section class="dashboard-welcome">

            <span class="eyebrow">TRANSACTIONS</span>

            <h1>
                История<br>
                <span>операций.</span>
            </h1>

            <div class="transactions-controls">

                <button type="button" data-limit="20">20</button>
                <button type="button" data-limit="50">50</button>
                <button type="button" data-limit="100">100</button>

            </div>

            <div id="transactions-list" class="transactions-list"></div>

            <p id="transactions-message" class="form-message"></p>

        </section>

    </main>

</div>

<script src="/static/js/app.js"></script>
<script src="/static/js/transactions.js"></script>

</body>
</html>
