<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eshak pay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="/static/img/eshak-logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div id="app">

    <header class="header">
        <a class="logo" href="/">
            <img src="/static/img/eshak-logo.png" alt="Eshak Pay">
            <span>eshak pay</span>
        </a>

        <div class="header-actions">
            <span id="header-user-email"></span>

            <button
                class="logout-button"
                id="logout-button"
                type="button"
            >
                Выйти
            </button>

            <button
                class="theme-toggle"
                id="theme-toggle"
                aria-label="Переключить тему"
            >
                ◐
            </button>
        </div>
    </header>

    <main class="dashboard">

        <section class="dashboard-welcome">
            <span class="eyebrow">PERSONAL ACCOUNT</span>

            <h1>
                Личный<br>
                <span>кабинет.</span>
            </h1>

            <p id="user-email"></p>

            <div class="balance-card">
                <span class="balance-label">Текущий баланс</span>
                <span id="account-balance">—</span>
            </div>

            <div class="dashboard-actions">

                <button
                    class="dashboard-action"
                    id="transfer-page-button"
                    type="button"
                >
                    <span class="action-title">Перевести</span>
                    <span class="action-description">
                        Отправить деньги другому пользователю
                    </span>
                </button>

                <button
                    class="dashboard-action"
                    id="transactions-page-button"
                    type="button"
                >
                    <span class="action-title">История операций</span>
                    <span class="action-description">
                        Посмотреть движения по счёту
                    </span>
                </button>

            </div>
        </section>

        <section class="easter-egg">
            <p>«Запомни три слова — это два слова.»</p>
        </section>

    </main>

    <footer class="footer">
        <span>ESHAK PAY © 2026</span>
        <span>BUILT FOR SIMPLICITY</span>
    </footer>

</div>

<script src="/static/js/app.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/transfer.js"></script>

</body>
</html>
