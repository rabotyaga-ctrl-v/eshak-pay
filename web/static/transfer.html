<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Перевод — Eshak pay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="/static/img/eshak-logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div id="app">
        <header class="header">
            <a class="logo" href="/">
                <img src="/static/img/eshak-logo.png" alt="Eshak Pay">
                <span>eshak pay</span>
            </a>

            <div class="header-actions">
                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    aria-label="Переключить тему"
                >
                    ◐
                </button>
            </div>
        </header>

        <main class="dashboard">

            <a href="/dashboard" class="back-link">
                ← Личный кабинет
            </a>

            <section class="dashboard-welcome">

                <span class="eyebrow">TRANSFER</span>

                <h1>
                    Перевести<br>
                    <span>деньги.</span>
                </h1>

                <section class="transfer-form" id="transfer-form">

                    <form id="transfer-form-element" novalidate>

                        <div class="form-group">
                            <label for="recipient-account-id">
                                Счёт получателя
                            </label>

                            <input
                                type="text"
                                id="recipient-account-id"
                                name="recipient-account-id"
                                placeholder="UUID счёта"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="transfer-amount">
                                Сумма</label>

                            <input
                                type="number"
                                id="transfer-amount"
                                name="transfer-amount"
                                placeholder="1000"
                                min="1"
                                step="0.01"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="button button-primary"
                        >
                            Перевести
                        </button>

                    </form>

                    <p id="transfer-message" class="form-message"></p>

                </section>

            </section>

        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/transfer.js"></script>
</body>
</html>
